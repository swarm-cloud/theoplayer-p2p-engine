<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8" />
    <title>THEOPlayer Demo</title>
    <style>
        body {
            font-family: "Roboto", sans-serif;
        }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/swarmcloud-theoplayer@latest"></script>
    <!-- THEOplayer build and UI -->
    <script src="//cdn.myth.theoplayer.com/c195a0cd-3811-40c6-80d7-384f09506239/THEOplayer.js"></script>
    <link
            rel="stylesheet"
            type="text/css"
            href="//cdn.myth.theoplayer.com/c195a0cd-3811-40c6-80d7-384f09506239/ui.css"
    />
</head>
<body>
<header></header>
<center>
    <div
            class="theoplayer-container video-js theoplayer-skin theo-seekbar-above-controls"
    ></div>
</center>
<p id="version"></p>
<h3>p2p info:</h3>
<p id="peers"></p>
<p id="info"></p>
<script>
    document.querySelector('#version').innerText = `p2p version: ${P2pEngineTheo.version}`;
    var element = document.querySelector(".theoplayer-container");
    var player = new THEOplayer.Player(element, {
        libraryLocation: "https://cdn.myth.theoplayer.com/c195a0cd-3811-40c6-80d7-384f09506239",
        ui: {
            width: "512px",
            height: "288px",
        },
        liveOffset: 30,
    });

    player.muted = true;
    player.autoplay = true;

    var engine = new P2pEngineTheo({
        // trackerZone: 'hk',        // if using Hongkong tracker
        // trackerZone: 'us',        // if using USA tracker
        // token: YOUR_TOKEN
    })
    engine.setPlayer(player);

    player.source = {
        sources: [
            {
                src: "https://test-streams.mux.dev/x36xhzz/url_8/193039199_mp4_h264_aac_fhd_7.m3u8",
                // src: "https://dash.akamaized.net/akamai/bbb_30fps/bbb_30fps.mpd",
            },
        ],
    };

    engine.on('stats', function (stats) {
        var total = stats.totalHTTPDownloaded + stats.totalP2PDownloaded;
        document.querySelector('#info').innerText = `p2p ratio: ${Math.round(stats.totalP2PDownloaded/total*100)}%   saved traffic: ${Math.round(stats.totalP2PDownloaded)}KB upload: ${Math.round(stats.totalP2PUploaded)}KB`;
    })

    engine.on('peers', function (peers) {
        document.querySelector('#peers').innerText = `peers: ${peers.length}`;
    })

</script>
</body>
</html>
